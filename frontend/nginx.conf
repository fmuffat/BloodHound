# Reverse proxy of the appliance: HTTPS termination, web UI and API.
# Certificate: /etc/nginx/certs/bloodhound.crt + bloodhound.key (shared volume
# with the backend, which installs a new one from Settings → SSL). A
# self-signed pair is generated on first start (docker/10-certs.sh), and
# docker/20-cert-watch.sh reloads nginx when the files change.

server_tokens off;

# Resolve service names at request time (Docker DNS): containers get new IPs
# when they are recreated, and nginx must not keep a stale address.
resolver 127.0.0.11 valid=10s ipv6=off;
client_max_body_size 2m;

gzip on;
gzip_types application/json application/javascript text/css image/svg+xml text/csv;
gzip_min_length 1024;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/bloodhound.crt;
    ssl_certificate_key /etc/nginx/certs/bloodhound.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:5m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        set $api_upstream http://backend:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrites any client-supplied value: used for login throttling
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # Exports and retention purges can take a while
        proxy_read_timeout 600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
